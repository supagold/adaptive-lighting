# homeops fork: simulator panel. Type-check, unit-test, and verify the committed bundle
# is exactly what the source builds to (HACS installs the committed file, no build step).
name: frontend

on:
  push:
    branches: [homeops]
    paths: ["frontend-src/**", "custom_components/adaptive_lighting/frontend/**", ".github/workflows/frontend.yaml"]
  pull_request:
    paths: ["frontend-src/**", "custom_components/adaptive_lighting/frontend/**"]

jobs:
  panel:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Committed bundle matches source
        run: git diff --exit-code -- ../custom_components/adaptive_lighting/frontend/
