name: Validate

on:
  push:
    branches: [master, homeops]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate_hacs:
    runs-on: "ubuntu-latest"
    if: github.repository == 'basnijholt/adaptive-lighting' || github.repository == 'supagold/adaptive-lighting' # homeops fork: validate HACS installability
    steps:
      - uses: "actions/checkout@v7.0.1"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
